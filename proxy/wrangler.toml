name = "claude-credit-proxy"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "claude-credit-monitor"
database_id = "b9321f9c-7405-411c-ae5c-3859cddfc39d"

# v3: run the Admin API spend pull every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
# v3: config fallback for the monthly spend cap, used only when the Admin API
# doesn't expose a limit. Not the source of truth — the Admin API/Console is.
MONTHLY_LIMIT_USD = "500"

# PROXY_SHARED_SECRET and ADMIN_API_KEY are secrets — set via:
#   wrangler secret put PROXY_SHARED_SECRET
#   wrangler secret put ADMIN_API_KEY
